<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 372" width="860" height="372" role="img" aria-label="How jeveryword works: number every word, let Jev pick a number, turn the number back into the exact text"><circle cx="26" cy="25" r="12" fill="#7c9cff"/><text x="26.0" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">1</text><text x="48.0" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Number every word</text><text x="191.8" y="30" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">const doc = tokenize(text)</text><rect x="48.0" y="52" width="70.6" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="83.3" y="71" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">0</text><text x="83.3" y="91" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="middle">Please</text><rect x="125.6" y="52" width="53.7" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="152.4" y="71" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">1</text><text x="152.4" y="91" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="middle">send</text><rect x="186.3" y="52" width="45.3" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="208.9" y="71" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" f