ospace" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">5</text><rect x="296.6" y="208" width="30.4" height="28" rx="14" fill="none" stroke="#30363d"/><text x="311.8" y="227" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">6</text><rect x="335.0" y="208" width="30.4" height="28" rx="14" fill="none" stroke="#30363d"/><text x="350.2" y="227" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">7</text><rect x="373.4" y="208" width="30.4" height="28" rx="14" fill="none" stroke="#30363d"/><text x="388.7" y="227" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">8</text><rect x="411.9" y="208" width="30.4" height="28" rx="14" fill="none" stroke="#30363d"/><text x="427.1" y="227" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">9</text><rect x="450.3" y="208" width="55.7" height="28" rx="14" fill="none" stroke="#30363d"/><text x="478.2" y="227" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">none</text><text x="524.0" y="227" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#56d364" text-anchor="start">99% sure</text><circle cx="26" cy="287" r="12" fill="#7c9cff"/><text x="26.0" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">3</text><text x="48.0" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">The number becomes the exact text again</text><text x="362.2" y="292" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">doc.pick(choice)</text><rect x="48" y="310" width="764" height="46" rx="10" fill="#161b22" stroke="#30363d"/><text x="66.0" y="339" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="500" fill="#e6edf3" text-anchor="start">{ value: &#x27;recieved&#x27;, start: 16, end: 24 }</text><text x="794.0" y="339" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="end">text.slice(16, 24) === value, always</text></svg>
